name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh release

      - name: Package
        run: |
          ditto -c -k --keepParent dist/MacTabber.app "dist/MacTabber-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "dist/MacTabber-${GITHUB_REF_NAME}.zip" > "dist/MacTabber-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MacTabber-${GITHUB_REF_NAME}.zip" \
            "dist/MacTabber-${GITHUB_REF_NAME}.zip.sha256" \
            --title "MacTabber ${GITHUB_REF_NAME}" \
            --generate-notes
